# Feature List                            Edit, add or remove features to be presented.
features                                  :

  - title                                 : Guided Reframes
    description                           : A step-by-step process that captures the situation, the emotions you felt (and how strongly), your automatic thoughts, the cognitive distortions at play, and the reframed thoughts that result.
    fontawesome_icon_name                 : clipboard-list

  - title                                 : Draft Autosave
    description                           : Your in-progress Reframe is continuously saved automatically. Quit midway and pick up exactly where you left off.
    fontawesome_icon_name                 : save

  - title                                 : Past Reframes
    description                           : Revisit past Reframes to spot recurring patterns and notice your growth.
    fontawesome_icon_name                 : history

  - title                                 : Recently Deleted
    description                           : Deleted Reframes are kept for 30 days, so accidental deletions are easy to restore.
    fontawesome_icon_name                 : undo

  - title                                 : Simple, Focused Interface
    description                           : A clean, distraction-free design that keeps you grounded in the reflection process.
    fontawesome_icon_name                 : eye

  - title                                 : Full-Text Search
    description                           : Quickly search across your Reframes — situations, automatic thoughts, challenges, and reframed thoughts alike.
    fontawesome_icon_name                 : search



